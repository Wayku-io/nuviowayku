name: Generate Images

on:
  schedule:
    # Runs at 04:00 AM every day
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the new images to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Or your preferred Node.js version

      - name: Install dependencies
        run: npm install

      - name: Run Image Generator
        run: node tools/image-generator/ImageGen.js

      - name: Commit generated images
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate images"

      - name: Purge JSDelivr Cache
        run: node tools/purge-jsdelivr.js
